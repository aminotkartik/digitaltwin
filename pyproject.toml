[project]
name = "vitalsync"
version = "1.0.0"
description = "VitalSync — Metabolic Digital Twin Platform for 2-hour blood glucose spike prediction (synthetic research prototype)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "xgboost-cpu>=2.0; sys_platform == 'linux'",
    "xgboost>=2.0; sys_platform != 'linux'",
    "joblib>=1.3",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "reportlab>=4.0",
]

[tool.vercel]
entrypoint = "backend.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
